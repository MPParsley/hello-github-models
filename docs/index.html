<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello GitHub Models</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 2rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 3rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        h1 { font-size: 2rem; margin-bottom: 1.5rem; }
        .greeting {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            min-height: 4rem;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .token-row {
            display: flex;
            gap: 0.5rem;
        }
        input[type="password"] {
            flex: 1;
            padding: 0.6rem 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        input[type="password"]::placeholder { color: rgba(255, 255, 255, 0.5); }
        input[type="password"]:focus { border-color: rgba(255, 255, 255, 0.6); }
        button {
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-generate {
            background: #fff;
            color: #764ba2;
        }
        .btn-save {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 0.85rem;
            padding: 0.6rem 1rem;
            white-space: nowrap;
        }
        .token-status {
            font-size: 0.8rem;
            opacity: 0.7;
        }
        .meta {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: 1rem;
        }
        a { color: #fff; }
        .error {
            color: #ffb3b3;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            word-break: break-word;
        }
        .help {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 0.5rem;
            line-height: 1.5;
        }
        .help a { text-decoration: underline; }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .loading { animation: pulse 1.2s ease-in-out infinite; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello GitHub Models</h1>

        <div id="greeting" class="greeting">Enter your GitHub token and click Generate to get a live AI greeting!</div>

        <div class="controls">
            <div class="token-row">
                <input type="password" id="token" placeholder="GitHub personal access token">
                <button class="btn-save" onclick="saveToken()">Save</button>
            </div>
            <div id="token-status" class="token-status"></div>
            <button id="generate-btn" class="btn-generate" onclick="generate()">Generate Greeting</button>
        </div>

        <div id="error" class="error"></div>

        <p class="help">
            Requires a <a href="https://github.com/settings/tokens?type=beta">fine-grained PAT</a>
            or <a href="https://github.com/settings/tokens">classic token</a>.<br>
            You must first <a href="https://github.com/marketplace/models">visit GitHub Models</a>
            and accept the terms to enable access.
        </p>

        <p class="meta">
            Powered by <a href="https://github.com/marketplace/models">GitHub Models</a>
            (gpt-4o-mini)<br>
            <span id="timestamp"></span>
        </p>
    </div>

    <script>
        const ENDPOINT = "https://models.inference.ai.azure.com/chat/completions";
        const MODEL = "gpt-4o-mini";

        const greetingEl = document.getElementById("greeting");
        const errorEl = document.getElementById("error");
        const tokenInput = document.getElementById("token");
        const tokenStatus = document.getElementById("token-status");
        const timestampEl = document.getElementById("timestamp");
        const generateBtn = document.getElementById("generate-btn");

        // Load saved token on start
        const saved = localStorage.getItem("gh_token");
        if (saved) {
            tokenInput.value = saved;
            tokenStatus.textContent = "Token loaded from local storage.";
        }

        function saveToken() {
            const token = tokenInput.value.trim();
            if (!token) {
                tokenStatus.textContent = "No token to save.";
                return;
            }
            localStorage.setItem("gh_token", token);
            tokenStatus.textContent = "Token saved to local storage.";
        }

        async function generate() {
            const token = tokenInput.value.trim();
            if (!token) {
                errorEl.textContent = "Please enter a GitHub token with Models access.";
                return;
            }

            errorEl.textContent = "";
            greetingEl.textContent = "Thinking...";
            greetingEl.classList.add("loading");
            generateBtn.disabled = true;

            try {
                const res = await fetch(ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token,
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [
                            { role: "system", content: "You are a friendly assistant. Keep responses to 2-3 sentences." },
                            { role: "user", content: "Say hello world in a creative and fun way! Include an emoji." },
                        ],
                        temperature: 0.9,
                        max_tokens: 150,
                    }),
                });

                if (!res.ok) {
                    const body = await res.text();
                    if (res.status === 401) {
                        throw new Error(
                            "Auth failed (401). Ensure your token is valid and you've accepted " +
                            "the GitHub Models terms at github.com/marketplace/models. " +
                            "Details: " + body
                        );
                    }
                    if (res.status === 403) {
                        throw new Error(
                            "Access denied (403). Your token may lack Models access, " +
                            "or you may need to accept the GitHub Models terms first. " +
                            "Details: " + body
                        );
                    }
                    throw new Error("API error " + res.status + ": " + body);
                }

                const data = await res.json();
                const message = data.choices[0].message.content.trim();

                greetingEl.textContent = message;
                timestampEl.textContent = "Generated live at " + new Date().toLocaleString();
            } catch (err) {
                greetingEl.textContent = "Something went wrong.";
                if (err instanceof TypeError) {
                    errorEl.textContent =
                        "Network error — the request was blocked. " +
                        "This may be a CORS issue or a connectivity problem. " +
                        "Try the CLI instead: python hello_models.py";
                } else {
                    errorEl.textContent = err.message;
                }
            } finally {
                greetingEl.classList.remove("loading");
                generateBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
