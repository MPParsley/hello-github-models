<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello GitHub Models</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 2rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 3rem;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        h1 { font-size: 2rem; margin-bottom: 1.5rem; }
        .greeting {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
        .meta {
            font-size: 0.85rem;
            opacity: 0.8;
        }
        a { color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello GitHub Models</h1>
        <div class="greeting">Hello, World! This page will be updated with an AI-generated greeting once the GitHub Action runs.</div>
        <p class="meta">
            Generated by <a href="https://github.com/marketplace/models">GitHub Models</a>
            (gpt-4o-mini)<br>
            Waiting for first Action run...
        </p>
    </div>
</body>
</html>
